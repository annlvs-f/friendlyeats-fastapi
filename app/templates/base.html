<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/">🍽️ FriendlyEats</a>
      <nav class="nav">
        <a href="/">Restaurantes</a>
        <a class="btn btn-primary" href="/restaurants/new">+ Nuevo restaurante</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% if flash %}
      <p class="flash flash-success" role="status">{{ flash }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">FriendlyEats · Sprint 1 · Restaurantes populares de la zona</div>
  </footer>

  <script src="/static/js/app.js"></script>
</body>
</html>
